project:
  type: website
  output-dir: _site
  # writes the photo lists + Google Images data the Home and Gallery pages include
  pre-render: scripts/seo_photos.py
  post-render: scripts/og_url.py
  render:
    - "*.qmd"
    - "/*.qmd"
  resources:
    - CNAME                 # custom domain for GitHub Pages (writtenwithlight.com)
    - LICENSE
    - .gitattributes
    - robots.txt
    - llms.txt              # plain-text summary of the site for AI tools
    - 55ce2aa24c77329f24b32dbe5cb306da.txt   # IndexNow key (proves the site is yours); see scripts/indexnow.py
    - certificates.json
    - "certificates/*"
    - "assets/gallery/photos.json"
    - "assets/gallery/full/*"
    - "assets/gallery/thumbs/*"
    - "assets/js/*"
    - "assets/images/*"

website:
  # SEO: the site name goes into every page title ("Gallery – Praveen Kumar Singh
  # Photography") and link previews; the navbar still shows only the logo
  title: "Praveen Kumar Singh Photography"
  description: "Fine art photographs of light, place and quiet moments by Praveen Kumar Singh, a Paris-based photographer. Limited-edition prints available."
  site-url: "https://writtenwithlight.com"
  favicon: "/assets/favicon.svg"
  image: "/assets/images/hero.jpg"         # default picture for link previews (1200 px wide or more)
  open-graph:
    locale: en_GB
    site-name: "Praveen Kumar Singh Photography"
    image-alt: "Car light trails winding up a cobbled street in Montmartre towards Sacré-Cœur at blue hour, Paris - photograph by Praveen Kumar Singh"
  twitter-card:
    card-style: summary_large_image
    site: "@singhpraveenk_p"
    creator: "@singhpraveenk_p"

  navbar:
    title: false
    logo: "/assets/logo-light.svg"
    logo-alt: "Praveen Kumar Singh Photography"
    pinned: true 
    right:
      - text: "Home"
        aria-label: "Home"
        href: index.qmd
      - text: "Gallery"
        aria-label: "Gallery"
        href: gallery/index.qmd
      - text: "Collections"
        aria-label: "Collections by place and theme"
        href: collections/index.qmd
      - text: "Stories"
        aria-label: "Stories behind the photographs"
        href: stories/index.qmd
      - text: "About"
        aria-label: "About"
        href: about/index.qmd
      - text: "Contact"
        aria-label: "Contact"
        href: contact/index.qmd


  search:
      location: navbar
      type: overlay
  # Quarto's own banner stays off: the site has its own (assets/js/consent.js),
  # switched on by the Google Analytics ID further down (PG_ANALYTICS_ID)
  cookie-consent: false
  
  # Footer: logo, a line about the work and the social icons on the left; three
  # columns of links on the right; copyright and email along the bottom.
  # Styles: "Footer" in assets/gallery.scss. Keep each line starting at the same
  # indent (no extra spaces), or Quarto may show the HTML as text.
  page-footer:
    left: |
      <div class="pg-footer">
      <div class="pg-footer-top">
      <div class="pg-footer-brand">
      <a class="pg-footer-logo-link" href="/" aria-label="Praveen Kumar Singh Photography, home"><img class="pg-footer-logo" src="/assets/logo-light.svg" alt="Praveen Kumar Singh Photography" width="1763" height="308" loading="lazy"></a>
      <p class="pg-footer-tag">Fine art photographs of light, place and quiet moments. Limited-edition prints from Paris, India and Nepal.</p>
      <span class="pg-foot-social">
      <a href="https://www.instagram.com/singhpraveenk_photography/" target="_blank" rel="noopener" aria-label="Instagram" title="Instagram"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C5.829 0 5.556.01 4.703.048 3.85.088 3.269.222 2.76.42a3.9 3.9 0 0 0-1.417.923A3.9 3.9 0 0 0 .42 2.76C.222 3.268.087 3.85.048 4.7.01 5.555 0 5.827 0 8.001c0 2.172.01 2.444.048 3.297.04.852.174 1.433.372 1.942.205.526.478.972.923 1.417.444.445.89.719 1.416.923.51.198 1.09.333 1.942.372C5.555 15.99 5.827 16 8 16s2.444-.01 3.298-.048c.851-.04 1.434-.174 1.943-.372a3.9 3.9 0 0 0 1.416-.923c.445-.445.718-.891.923-1.417.197-.509.332-1.09.372-1.942C15.99 10.445 16 10.173 16 8s-.01-2.445-.048-3.299c-.04-.851-.175-1.433-.372-1.941a3.9 3.9 0 0 0-.923-1.417A3.9 3.9 0 0 0 13.24.42c-.51-.198-1.092-.333-1.943-.372C10.443.01 10.172 0 7.998 0zm-.717 1.442h.718c2.136 0 2.389.007 3.232.046.78.035 1.204.166 1.486.275.373.145.64.319.92.599s.453.546.598.92c.11.281.24.705.275 1.485.039.843.047 1.096.047 3.231s-.008 2.389-.047 3.232c-.035.78-.166 1.203-.275 1.485a2.5 2.5 0 0 1-.599.919c-.28.28-.546.453-.92.598-.28.11-.704.24-1.485.276-.843.038-1.096.047-3.232.047s-2.39-.009-3.233-.047c-.78-.036-1.203-.166-1.485-.276a2.5 2.5 0 0 1-.92-.598 2.5 2.5 0 0 1-.6-.92c-.109-.281-.24-.705-.275-1.485-.038-.843-.046-1.096-.046-3.233s.008-2.388.046-3.231c.036-.78.166-1.204.276-1.486.145-.373.319-.64.599-.92s.546-.453.92-.598c.282-.11.705-.24 1.485-.276.738-.034 1.024-.044 2.515-.045zm4.988 1.328a.96.96 0 1 0 0 1.92.96.96 0 0 0 0-1.92m-4.27 1.122a4.109 4.109 0 1 0 0 8.217 4.109 4.109 0 0 0 0-8.217m0 1.441a2.667 2.667 0 1 1 0 5.334 2.667 2.667 0 0 1 0-5.334"/></svg></a>
      <a href="https://www.facebook.com/praveenphotography/" target="_blank" rel="noopener" aria-label="Facebook" title="Facebook"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M16 8.049c0-4.446-3.582-8.05-8-8.05C3.58 0-.002 3.603-.002 8.05c0 4.017 2.926 7.347 6.75 7.951v-5.625h-2.03V8.05H6.75V6.275c0-2.017 1.195-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258v1.51h2.218l-.354 2.326H9.25V16c3.824-.604 6.75-3.934 6.75-7.951"/></svg></a>
      <a href="https://x.com/singhpraveenk_p" target="_blank" rel="noopener" aria-label="X" title="X"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M12.6.75h2.454l-5.36 6.142L16 15.25h-4.937l-3.867-5.07-4.425 5.07H.316l5.733-6.57L0 .75h5.063l3.495 4.633L12.601.75Zm-.86 13.028h1.36L4.323 2.145H2.865z"/></svg></a>
      </span>
      </div>
      <nav class="pg-footer-cols" aria-label="Footer">
      <div class="pg-footer-col"><p class="pg-footer-h">Explore</p>
      <ul><li><a href="/">Home</a></li><li><a href="/gallery/">Gallery</a></li><li><a href="/collections/">Collections</a></li><li><a href="/stories/">Stories</a></li><li><a href="/about/">About</a></li><li><a href="/contact/">Contact</a></li></ul></div>
      <div class="pg-footer-col"><p class="pg-footer-h">Prints</p>
      <ul><li><a href="https://www.saatchiart.com/en-fr/singhpraveenk" target="_blank" rel="noopener">Saatchi Art</a></li><li><a href="https://www.artfinder.com/artist/singhpraveenk" target="_blank" rel="noopener">Artfinder</a></li><li><a href="https://www.photo4me.com/profile/singhpraveenk" target="_blank" rel="noopener">Photo4me</a></li><li><a href="/#prints">About the prints</a></li><li><a href="/verify/">Verify a certificate</a></li></ul></div>
      <div class="pg-footer-col"><p class="pg-footer-h">Legal</p>
      <ul><li><a href="/privacy/">Privacy &amp; cookies</a></li><li><a href="/privacy/" class="pg-cookie-prefs" hidden>Cookie preferences</a></li><li><a href="/contact/#image-use">Image licensing</a></li></ul></div>
      </nav>
      </div>
      <div class="pg-footer-bottom">
      <span class="pg-footer-copy">&#169; <span class="pg-years" data-since="2026">2026</span> Praveen Kumar Singh · All rights reserved</span>
      <a class="pg-footer-mail" href="mailto:praveen.singh@writtenwithlight.com"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v.217l7 4.2 7-4.2V4a1 1 0 0 0-1-1zm13 2.383-4.708 2.825L15 11.105zm-.034 6.876-5.64-3.471L8 9.583l-1.326-.795-5.64 3.47A1 1 0 0 0 2 13h12a1 1 0 0 0 .966-.741M1 11.105l4.708-2.897L1 5.383z"/></svg>praveen.singh@writtenwithlight.com</a>

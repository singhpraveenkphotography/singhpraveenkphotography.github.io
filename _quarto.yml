  #   type: info
  #   position: below-navbar
  
format:
  html:
    include-in-header:
      text: |
        <script>document.documentElement.classList.add('js');</script>
        <!-- Visitor statistics: paste your Google Analytics measurement ID between the
             quotes (it looks like G-AB12CD34EF). Empty = no statistics and no banner.
             With an ID, visitors are asked first; nothing loads until they click Accept. -->
        <script>window.PG_ANALYTICS_ID = "G-KRF4PVXV6Q";</script>
        <!-- Search engines: paste each verification code between the quotes, then delete the comment markers around that line -->
        <!-- Link previews (Facebook, WhatsApp, LinkedIn): size of hero.jpg (2000 x 1500); update if you replace it -->
        <meta property="og:type" content="website">
        <meta property="og:image:width" content="2000">
        <meta property="og:image:height" content="1500">
        <meta property="og:image:type" content="image/jpeg">
        <!-- search engines: index the pages and show the photos large in results -->
        <meta name="robots" content="index, follow, max-image-preview:large">
        <meta name="author" content="Praveen Kumar Singh">
        <meta name="google-site-verification" content="oVfqURcwH2wcUv3b0OjNCAkp8ySQPsSkbwxfby-tCvI">
        <!-- <meta name="msvalidate.01" content="PASTE-BING-CODE-HERE"> -->
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@graph": [
            {
              "@type": "Person",
              "@id": "https://writtenwithlight.com/#praveen",
              "name": "Praveen Kumar Singh",
              "jobTitle": "Photographer",
              "description": "Photographer and atmospheric science researcher based in Paris.",
              "url": "https://writtenwithlight.com/",
              "image": "https://writtenwithlight.com/assets/images/profile.jpg",
              "email": "mailto:praveen.singh@writtenwithlight.com",
              "address": { "@type": "PostalAddress", "addressLocality": "Paris", "addressCountry": "FR" },
              "sameAs": [
                "https://www.instagram.com/singhpraveenk_photography/",
                "https://www.facebook.com/praveenphotography/",
                "https://www.saatchiart.com/en-fr/singhpraveenk",
                "https://www.artfinder.com/artist/singhpraveenk/",
                "https://www.photo4me.com/profile/singhpraveenk",
                "https://x.com/singhpraveenk_p"
              ]
            },
            {
              "@type": "Organization",
              "@id": "https://writtenwithlight.com/#organization",
              "name": "Praveen Kumar Singh Photography",
              "url": "https://writtenwithlight.com/",
              "logo": "https://writtenwithlight.com/assets/logo-light.svg",
              "founder": { "@id": "https://writtenwithlight.com/#praveen" },
              "email": "mailto:praveen.singh@writtenwithlight.com"
            },
            {
              "@type": "WebSite",
              "@id": "https://writtenwithlight.com/#website",
              "name": "Praveen Kumar Singh Photography",
              "url": "https://writtenwithlight.com/",
              "description": "Fine art photographs of light, place and quiet moments by Paris-based photographer Praveen Kumar Singh, with limited-edition and open-edition prints.",
              "inLanguage": "en",
              "publisher": { "@id": "https://writtenwithlight.com/#organization" },
              "author": { "@id": "https://writtenwithlight.com/#praveen" },
              "copyrightHolder": { "@id": "https://writtenwithlight.com/#praveen" }
            }
          ]
        }
        </script>
    include-before-body:
      text: |
        <div class="pg-grain" aria-hidden="true"></div>
    include-after-body:
      text: |
        <script src="/assets/js/consent.js" defer></script>
        <script src="/assets/js/protect.js" defer></script>
        <script>
          /* footer: "© 2023–2026" from the earliest photo year to this year, updated automatically */
          (function () {
            var el = document.querySelector('.pg-years'); if (!el) return;
            var now = new Date().getFullYear(), since = parseInt(el.dataset.since, 10) || now;
            var show = function (y) { el.textContent = y < now ? y + '–' + now : String(now); };
            show(since);
            fetch('/assets/gallery/photos.json').then(function (r) { return r.ok ? r.json() : null; })
              .then(function (d) {
                var ys = ((d && d.photos) || []).map(function (p) { return p.copyright_year; }).filter(Boolean);
                if (ys.length) show(Math.min(since, Math.min.apply(null, ys)));
              }).catch(function () {});
          })();
        </script>
    theme: 
      light: [cosmo, assets/colors-light.scss, assets/theme-light.scss, assets/gallery.scss]
      dark:  [cosmo, assets/colors-dark.scss,  assets/theme-dark.scss, assets/gallery.scss]
    highlight-style:
      light: a11y-light
      dark: a11y-dark
    code-link: true
    canonical-url: true                    # tells Google the one official address of each page
    lightbox: true
    

execute:
  freeze: auto
  enabled: true


  

  


